services:
  dagsverket:
    # Prebuilt image published by CI. `docker compose pull` to fetch/update it.
    image: ghcr.io/dvalfrid/dagsverket:latest
    # …or build from a source checkout instead: `docker compose build`
    build: .
    container_name: dagsverket
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/dagsverket.db"
      TZ: "${TZ:-Europe/Stockholm}"
      # Put these in a .env file next to this compose file (compose reads it automatically).
      ADMIN_PIN: "${ADMIN_PIN:-1234}"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in .env — generate with: openssl rand -hex 32}"
    volumes:
      - dagsverket-data:/data

volumes:
  dagsverket-data:
