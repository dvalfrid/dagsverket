name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build/tests never touch a real database; Prisma just wants the var set.
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-placeholder-secret-not-a-real-value-0000000000"
      TZ: "Europe/Stockholm"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate migrations match schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Build the Docker image on every run so a broken Dockerfile fails a PR.
  # Push tags to GHCR only after `verify` passes:
  #   - push to main  -> :main  and  :sha-<short>   (bleeding edge, for testing)
  #   - tag vX.Y.Z     -> :X.Y.Z  :X.Y  :X  :latest  (a real release)
  #   - pull request   -> build only, nothing pushed
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is applied automatically to the newest semver tag only
          # (metadata-action's default flavor: latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Most NAS Docker hosts are x86_64. To also serve ARM NAS units, add:
          #   platforms: linux/amd64,linux/arm64
          # (needs docker/setup-qemu-action; ARM builds under emulation are slow)
